<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
    <style>
        .child {
            background-color: lightcoral;
            color: crimson;
            font-size: 40px;
            padding: 30px;
            border: 2px solid black;
        }

        .parent {
            display: flex;
            flex-direction: row;

            justify-content: center;
            align-items: center;

            gap: 20px;
            height: 100vh;
        }
    </style>    
</head>
<body>
    <div class="parent">
        <div class="child">Child 1</div>
        <div class="child">Child 2</div>
        <div class="child">Child 3</div>
    </div>
</body>
</html>
