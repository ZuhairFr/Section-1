<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

<link href="https://fonts.googleapis.com/css?family=Roboto:100,200,300,regular,500,600,700,800,900,100italic,200italic,300italic,italic,500italic,600italic,700italic,800italic,900italic" rel="stylesheet" />

    <style>
        * {
            font-family: 'Times New Roman', Times, serif;
        }
        .card {
            /* border: 2px solid black; */
            background-color: white;
            width: 25%;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 5px 12px 12px 10px #242038;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* background-color: aqua; */
            background-image: linear-gradient(132deg, #725AC1,#8D86C9,#CAC4CE);
            /* background-image: url('Chess.jpg');
            background-size: cover; */
        }

        .form-title {
            text-align: center;
            font-size: 30px;
        }

        .text-input {
            width: 100%;
            display: block;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 30px;
            margin-top: 5px;
        }

        .btn-submit {
            background-color: blueviolet;
            color: white;
            padding: 10px;
            border: none;
            display: block;
            width: 100%;
        }
        
        .link {
            display: block;
            color: blueviolet;
            text-decoration: none;
        }

        .forgot-link {
            text-align: right;
            margin-bottom: 20px;
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    
    <div class="card">
        <h3 class="form-title">Login Form</h3>
        <form action="">
            <label for="">Email Address</label>
            <input type="email" class="text-input">

            <label for="">Password</label>
            <input type="password" class="text-input">

            <a href="#" class="link forgot-link">Forgot Password</a>

            <button class="btn-submit">Submit</button>

             <a href="#" class="link signup-link">
                Not Registered yet? Signup Now
             </a> 
            
        </form>
    </div>

</body>
</html>
