<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

<link href="https://fonts.googleapis.com/css?family=Roboto:100,200,300,regular,500,600,700,800,900,100italic,200italic,300italic,italic,500italic,600italic,700italic,800italic,900italic" rel="stylesheet" />

    <style>
        * {
            font-family: 'Times New Roman', Times, serif;
        }
        .card {
            /* border: 2px solid black; */
            width: 25%;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 5px 7px 12px 0px rgba(0, 0, 0, 0.422);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
    </style>
</head>
<body>
    
    <div class="card">
        <h3 class="form-title">Login Form</h3>
        <form action="">
            <label for="">Email Address</label>
            <input type="email" class="text-input">

            <label for="">Password</label>
            <input type="password" class="text-input">

            <button class="btn-submit">Submit</button>
        </form>
    </div>

</body>
</html>
