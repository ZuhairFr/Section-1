<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>


<body class="flex justify-center items-center h-screen bg-gray-100">

    <div class="bg-white w-1/5 shadow-xl rounded-xl p-8">

        <h3 class="text-center font-semibold text-2xl my-6">Login Form</h3>
        <form action="">
            <label for="">Email Address</label>
            <input type="email" class="border p-2 block w-full rounded-lg mb-4 mt-1">

            <label for="">Password</label>
            <input type="password" class="text-input">

            <a href="#" class="link forgot-link">Forgot Password</a>

            <button class="bg-[blueviolet] block w-full text-white p-2 rounded-lg">Submit</button>

             <a href="#" class="link signup-link">
                Not Registered yet? Signup Now
             </a> 
            
        </form>
    </div>
</body>
</html>
